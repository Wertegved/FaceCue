<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 700 180"
     width="1400"
     height="360"
     role="img"
     aria-labelledby="title desc">
  <title id="title">FaceCue</title>
  <desc id="desc">FaceCue logo with a rounded lavender-blue face icon and the FaceCue wordmark.</desc>
  <defs>
    <linearGradient id="faceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9b8f5"/>
      <stop offset="58%" stop-color="#b9c9f6"/>
      <stop offset="100%" stop-color="#9eddf0"/>
    </linearGradient>
    <linearGradient id="innerLight" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Face icon -->
  <g transform="translate(20 15)" filter="url(#shadow)">
    <rect width="150" height="150" rx="31" fill="url(#faceGradient)"/>
    <rect width="150" height="150" rx="31" fill="url(#innerLight)"/>
    <rect x="3" y="3" width="144" height="144" rx="29"
          fill="none" stroke="#ffffff" stroke-opacity=".24" stroke-width="2"/>

    <!-- Minimal expressive face -->
    <g fill="none" stroke="#1c2635" stroke-width="7"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 52 Q46 43 58 52"/>
      <path d="M91 52 Q103 43 115 52"/>
      <circle cx="47" cy="67" r="3.5" fill="#1c2635" stroke="none"/>
      <circle cx="101" cy="67" r="3.5" fill="#1c2635" stroke="none"/>
      <path d="M75 55 C75 69 75 76 67 83 C62 87 62 94 68 97"/>
      <path d="M49 105 Q72 127 102 104"/>
    </g>
  </g>

